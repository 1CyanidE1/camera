name: Convert models

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/convert-models.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: convert-models
  cancel-in-progress: true

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "torch==2.7.0" "coremltools==9.*" numpy pillow

      - name: Fetch weights
        run: bash scripts/fetch_weights.sh work

      - name: Convert
        run: |
          set +e
          python -I -u scripts/convert_models.py work FrameFinder/Models > convert.log 2>&1
          status=$?
          echo "exit status $status" >> convert.log
          cat convert.log
          if [ $status -ne 0 ]; then
            tr '\r' '\n' < convert.log | grep -v '%|' | grep -v '^[[:space:]]*$' | tail -40 | cut -c1-240 > tail.log
            echo "::error title=convert.log::$(sed 's/%/%25/g; s/::/: :/g' tail.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Commit models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrameFinder/Models THIRD_PARTY
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Модели Core ML"
            git pull --rebase origin main
            git push
          fi

      - name: Start app build
        run: gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
